[package]
name = "stonebrook"
version = "2.3.0"
edition = "2021"
license = "MIT"
description = "石渠 Stonebrook — 本地块级文档编辑器"

[features]
# 开发用：脚本驱动的端到端测试（STONEBROOK_SCRIPT）、压测数据生成与菜单入口。
# 默认开启；正式打包用 --no-default-features 剔除（见 scripts/build.sh）。
default = ["dev"]
dev = []

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
pulldown-cmark = { version = "0.12", default-features = false }
scraper = "0.20"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "gif", "webp", "ico", "bmp"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSProcessInfo", "NSArray", "NSData", "NSURL", "NSError", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSEnumerator", "NSKeyValueCoding", "NSURLRequest", "NSValue", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSEvent", "NSView", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSWorkspace", "NSApplication", "NSRunningApplication", "NSGraphicsContext", "NSPrintOperation", "NSPrintInfo", "objc2-core-foundation", "objc2-core-graphics", "block2"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigationDelegate", "WKNavigationAction", "WKWebsiteDataStore", "WKWebViewConfiguration", "WKPreferences", "WKWebpagePreferences", "WKSnapshotConfiguration", "WKNavigation", "WKPDFConfiguration", "WKFrameInfo", "objc2-app-kit", "block2"] }
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVAssetImageGenerator", "AVTime", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "objc2-core-graphics", "block2"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFLocale", "CFStringTokenizer", "CFBase", "CFCGTypes", "CFArray"] }
core-video = "=0.4.3"
url = "2"
sha2 = "0.10"
ureq = "3"
roughr = "0.14"
# 草图：自由画 / 线条圆头圆角（与 GPUI 内部的 lyon 同一版本）
lyon_tessellation = "1.0"
rstar = "0.12"
resvg = "0.45"
ttf-parser = "0.25"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ironcalc = "0.9"
raw-window-handle = "0.6"
encoding_rs = "0.8"
smallvec = "1"
regex = "1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
roxmltree = "0.21.2"

# 与 GPUI 代码形态冲突的风格类 lint（闭包里的长类型、按列下标的像素表、布局好的大枚举）。
# 其余 clippy 警告一律清零：scripts/check.sh 与 CI 以 -D warnings 运行。
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
wrong_self_convention = "allow"

[dev-dependencies]
# 无头 TestAppContext：编辑内核随机测试直接驱动真实的 Editor
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# 本地 vendored GPUI 0.2.2，改动均标注 [stonebrook patch]：
# - STONEBROOK_FORCE_DRAW 环境变量控制的绘制开关（vendor/gpui/src/platform/mac/window.rs）
# - 网格按权重分配列宽 `grid_col_weights`（表格列宽拖动用；style.rs / styled.rs / taffy.rs）
# 本地 vendored ironcalc_base 0.9.1，改动标注 [stonebrook patch]：
# - UserModel 的应用扩展数据 `ext`（get_ext / set_ext，进入撤销历史）
# - 批量修改 begin_batch / end_batch：多次修改合并为一个撤销步骤
[patch.crates-io]
gpui = { path = "vendor/gpui" }
ironcalc_base = { path = "vendor/ironcalc_base" }
