name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 第三方 Action 固定到提交哈希（注释里是对应的标签），由 Dependabot 维护升级
jobs:
  # 发版前跑一遍完整检查：tag 打在红的提交上时不出包
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 编译器版本由 rust-toolchain.toml 固定，与 ci.yml 写法一致
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: fmt / clippy / test
        run: scripts/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # 检查已在 check 任务里做过，这里只构建
      - name: Build app and DMG
        run: scripts/build.sh --fast

      - name: Rename artifacts
        id: pkg
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp "dist/石渠-${VERSION}.dmg" "out/Stonebrook-${VERSION}-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent "dist/石渠.app" "out/Stonebrook-${VERSION}-${{ matrix.arch }}.app.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stonebrook-${{ matrix.arch }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 只有发布任务需要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: SHA-256 checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          generate_release_notes: true
